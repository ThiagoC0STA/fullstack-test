services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 18
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18.3-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
      POSTGRES_EXTRA_DATABASES: games,wallets
    volumes:
      # postgres:18 images expect the mount at /var/lib/postgresql (data
      # lives in a versioned subdirectory so pg_upgrade can work in-place)
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # RabbitMQ (with management UI)
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4.2.4-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Keycloak (Identity Provider)
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.5
    restart: unless-stopped
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # Pin the issuer to localhost so tokens minted over the back channel
      # (the BFF calling keycloak:8080) still carry iss=localhost:8080, which
      # is what the browser uses and what the services validate against.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # Keycloak 25+ serves health on the management port (9000)
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Kong (API Gateway — DB-less / declarative)
  # ---------------------------------------------------------------------------
  kong:
    image: kong:3.9.1
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      # dev machines accumulate cookies for ALL localhost apps; nginx's
      # default 8k header buffer would reject those requests with a 400
      KONG_NGINX_HTTP_LARGE_CLIENT_HEADER_BUFFERS: 8 24k
      # when a service container is recreated it gets a new IP; Kong's
      # default DNS cache would keep proxying to the dead one (502s)
      # for up to an hour, so re-resolve within seconds instead
      KONG_DNS_VALID_TTL: "5"
      KONG_DNS_STALE_TTL: "5"
    volumes:
      - ./docker/kong:/kong:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Games Service
  # ---------------------------------------------------------------------------
  games:
    build:
      context: .
      dockerfile: services/games/Dockerfile
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      DATABASE_URL: postgresql://admin:admin@postgres:5432/games
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/crash-game/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8080/realms/crash-game
      BETTING_WINDOW_MS: "10000"
      COOLDOWN_MS: "4000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # bun alpine ships wget (busybox), not curl; 127.0.0.1 because
      # busybox resolves localhost to ::1 and the app listens on IPv4
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Wallets Service
  # ---------------------------------------------------------------------------
  wallets:
    build:
      context: .
      dockerfile: services/wallets/Dockerfile
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      PORT: 4002
      DATABASE_URL: postgresql://admin:admin@postgres:5432/wallets
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/crash-game/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8080/realms/crash-game
      WALLET_INITIAL_BALANCE_CENTS: "100000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # bun alpine ships wget (busybox), not curl; 127.0.0.1 because
      # busybox resolves localhost to ::1 and the app listens on IPv4
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Frontend (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # BFF back-channel targets (server -> services, by Docker service name).
      # The browser-facing NEXT_PUBLIC_* values stay at localhost, baked in
      # at build time, so redirects land back on the evaluator's machine.
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      API_INTERNAL_URL: http://kong:8000
    depends_on:
      kong:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
