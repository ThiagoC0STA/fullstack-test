name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck contracts
        run: cd packages/contracts && bun run typecheck

      - name: Typecheck platform
        run: cd packages/platform && bun run typecheck

      - name: Typecheck games service
        run: cd services/games && bun run typecheck

      - name: Typecheck wallets service
        run: cd services/wallets && bun run typecheck

      - name: Typecheck frontend
        run: cd frontend && bun run typecheck

      - name: Unit tests - contracts
        run: cd packages/contracts && bun test tests

      - name: Unit tests - games
        run: cd services/games && bun test tests/unit

      - name: Unit tests - wallets
        run: cd services/wallets && bun test tests/unit

      - name: Unit tests - frontend
        run: cd frontend && bun test tests

      - name: Frontend production build
        run: cd frontend && bun run build
